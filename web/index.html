<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#0c0508">
    <title>Neko Run</title>
    <link rel="icon" href="icon.png" type="image/png">
    <style>
        @font-face { font-family: 'Press Start 2P'; src: url('fonts/PressStart2P-Regular.ttf') format('truetype'); font-display: block; }
        html, body { margin: 0; height: 100%; background: #0c0508; overflow: hidden; overscroll-behavior: none; }
    </style>
    <script>
        // Android shell loads index.html?platform=android, the desktop shell ?platform=desktop.
        (function () {
            var m = /[?&]platform=(\w+)/.exec(location.search);
            document.documentElement.setAttribute('data-platform', m ? m[1] : 'web');
        })();
    </script>
    <script src="neko-run.js" defer></script>
</head>
<body>
    <div id="game"></div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var platform = document.documentElement.getAttribute('data-platform');
            window.nekoRun = NekoRun.mount(document.getElementById('game'), {
                prefix: 'nekorun_',
                mode: 'app',
                desktop: platform !== 'android',
                fullscreen: platform !== 'android'
            });
        });
    </script>
</body>
</html>
